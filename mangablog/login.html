<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MangaBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
        }
        .auth-card h2 {
            font-family: var(--font-heading);
            margin-bottom: 2rem;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: white;
            font-family: var(--font-main);
            outline: none;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }
        .btn-full {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <h1>Manga<span>Blog</span> <i class="fa-solid fa-dragon logo-icon"></i></h1>
            </a>
        </div>
        <div class="user-menu">
            <a href="index.html" class="btn btn-icon"><i class="fa-solid fa-arrow-left"></i> Retour</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="card auth-card">
            <h2>Rejoins la guilde</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="Itachi" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="loginError" style="color: red; margin-bottom: 1rem; display: none;">Identifiants incorrects.</div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Se Connecter</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('http://127.0.0.1:8000/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = 'index.html';
                } else {
                    errorDiv.style.display = 'block';
                    btn.innerHTML = 'Se Connecter';
                    btn.disabled = false;
                }
            } catch (err) {
                errorDiv.innerText = "Erreur de connexion au serveur.";
                errorDiv.style.display = 'block';
                btn.innerHTML = 'Se Connecter';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
